<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toast · Invoices prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#2C51A9; --blue-d:#22428C; --blue-t:#EEF2FB;
  --orange:#FF4C00; --orange-t:#FDEEE8; --orange-tx:#B8400F;
  --ink:#1F1F1F; --ink2:#444; --mute:#6B6B6B; --mute2:#737373;
  --line:#E6E6E6; --line2:#EDEDED; --bg:#F6F6F6; --card:#fff;
  --ok:#1E7B3C; --ok-t:#E7F5EC; --warn:#8A5A00; --warn-tx:#9A6400; --warn-t:#FDF3D8;
  --err:#C62828; --err-t:#FDECEC; --iq:#C43D16; --ai:#C43D16; --orbimg:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20256%20256%22%3E%20%3Cdefs%3E%20%3ClinearGradient%20id%3D%22tiqA%22%20gradientUnits%3D%22userSpaceOnUse%22%20x1%3D%2270%22%20y1%3D%2240%22%20x2%3D%22112%22%20y2%3D%22250%22%3E%20%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23FF2E1F%22%2F%3E%20%3Cstop%20offset%3D%220.42%22%20stop-color%3D%22%23FF541A%22%2F%3E%20%3Cstop%20offset%3D%220.66%22%20stop-color%3D%22%23FCA82C%22%2F%3E%20%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23F8DA98%22%2F%3E%20%3C%2FlinearGradient%3E%20%3ClinearGradient%20id%3D%22tiqB%22%20gradientUnits%3D%22userSpaceOnUse%22%20x1%3D%22128%22%20y1%3D%22120%22%20x2%3D%22222%22%20y2%3D%22150%22%3E%20%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23B07CF0%22%20stop-opacity%3D%220%22%2F%3E%20%3Cstop%20offset%3D%220.3%22%20stop-color%3D%22%23A47BF4%22%20stop-opacity%3D%220.92%22%2F%3E%20%3Cstop%20offset%3D%220.66%22%20stop-color%3D%22%235C95FB%22%2F%3E%20%3Cstop%20offset%3D%221%22%20stop-color%3D%22%2308A6FF%22%2F%3E%20%3C%2FlinearGradient%3E%20%3ClinearGradient%20id%3D%22tiqC%22%20gradientUnits%3D%22userSpaceOnUse%22%20x1%3D%22180%22%20y1%3D%2214%22%20x2%3D%22236%22%20y2%3D%2282%22%3E%20%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23FF3A22%22%2F%3E%20%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23FF6A12%22%2F%3E%20%3C%2FlinearGradient%3E%20%3Cmask%20id%3D%22tiqM%22%20maskUnits%3D%22userSpaceOnUse%22%20x%3D%220%22%20y%3D%220%22%20width%3D%22256%22%20height%3D%22256%22%3E%20%3Cpath%20d%3D%22M112%2036Q124%20128%20216%20140Q124%20152%20112%20244Q100%20152%208%20140Q100%20128%20112%2036Z%22%20fill%3D%22%23fff%22%20stroke%3D%22%23fff%22%20stroke-width%3D%2214%22%20stroke-linejoin%3D%22round%22%2F%3E%20%3C%2Fmask%3E%20%3C%2Fdefs%3E%20%3Cg%20mask%3D%22url%28%23tiqM%29%22%3E%20%3Crect%20width%3D%22256%22%20height%3D%22256%22%20fill%3D%22url%28%23tiqA%29%22%2F%3E%20%3Crect%20width%3D%22256%22%20height%3D%22256%22%20fill%3D%22url%28%23tiqB%29%22%2F%3E%20%3C%2Fg%3E%20%3Cpath%20d%3D%22M206%2012Q210%2042%20240%2046Q210%2050%20206%2080Q202%2050%20172%2046Q202%2042%20206%2012Z%22%20fill%3D%22url%28%23tiqC%29%22%20stroke%3D%22url%28%23tiqC%29%22%20stroke-width%3D%229%22%20stroke-linejoin%3D%22round%22%2F%3E%20%3C%2Fsvg%3E"); --ai-t:#FFF6F1; --ai-b:#F3D3C6;
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
a{color:var(--blue);text-decoration:none;font-weight:600;cursor:pointer}
a:hover{text-decoration:underline}
.ic{width:20px;height:20px;fill:currentColor;flex:none;display:inline-block;vertical-align:middle}
.ic.s16{width:16px;height:16px}.ic.s14{width:14px;height:14px}.ic.s24{width:24px;height:24px}
/* layout */
.app{display:flex;height:100vh;overflow:hidden}
.side{width:240px;flex:none;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;transition:width .2s}
.side .brand{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px 0 20px}
.side .brand img{width:80px;height:21px}
.iconbtn{background:none;border:0;padding:6px;border-radius:8px;color:var(--ink2);display:inline-flex}
.iconbtn:hover{background:#F1F1F1}
.nav{padding:10px 12px;overflow:auto;flex:1}
.nv{display:flex;align-items:center;gap:14px;height:44px;padding:0 12px;border-radius:10px;color:var(--ink);font-size:15px;font-weight:500;cursor:pointer;user-select:none;margin-bottom:2px}
.nv:hover{background:#F5F5F5}
.nv .chev{margin-left:auto;color:var(--mute)}
.sub{position:relative;margin:2px 0 6px}
.sub:after{content:"";position:absolute;left:22px;top:0;bottom:27px;width:1px;background:#DDD}
.si{position:relative;display:flex;align-items:center;gap:10px;height:38px;padding:0 10px 0 42px;border-radius:8px;color:#444;font-size:14px;cursor:pointer;margin-bottom:2px}
.si:before{content:"";position:absolute;left:22px;top:0;width:14px;height:19px;border-left:1px solid #DDD;border-bottom:1px solid #DDD;border-bottom-left-radius:8px}
.si:last-child{margin-bottom:0}
.si .ic{width:16px;height:16px;color:#8C8C8C;flex:none}
.si:hover{background:#F5F5F5}
.si.on{background:var(--orange-t);color:var(--orange-tx);font-weight:600}
.si.on .ic{color:var(--orange-tx)}
.si .cnt{margin-left:auto;font-size:11px;font-weight:600;background:#EFEFEF;color:#555;border-radius:999px;padding:1px 7px}
.si.on .cnt{background:var(--orange);color:#fff}
/* rail */
.side.rail{width:64px}
.rail .brand{padding:0;justify-content:center;background:var(--orange);width:64px}
.rail .rb{width:64px;display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:4px;flex:1}
.rbi{position:relative;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:10px;color:#555;cursor:pointer}
.rbi:hover{background:#F3F3F3}
.rbi.on{background:var(--orange-t);color:var(--orange-tx)}
.rbi .dot{position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--orange);border:1.5px solid #fff}
.rbi .gdot{position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:#2E9E5B;border:1.5px solid #fff}
.navstat{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.navstat:hover{background:#F5F5F5}
.navstat .nsdot{width:6px;height:6px;border-radius:50%;background:#2E9E5B;flex:none}
.navstat .nst{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.navstat .nst b{font-size:12.5px;font-weight:600;color:var(--ink)}
.navstat .nst span{font-size:11.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rdiv{width:28px;height:1px;background:var(--line);margin:6px 0}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{height:56px;flex:none;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;gap:16px}
.loc{position:relative}
.locbtn{white-space:nowrap;display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;border:1px solid #D9D9D9;border-radius:8px;background:#fff;font-weight:500;font-size:14px}
.menu{position:absolute;top:38px;left:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:6px;min-width:280px;z-index:30}
.menu .mi{padding:9px 10px;border-radius:7px;cursor:pointer;display:flex;align-items:center;gap:10px}
.menu .mi:hover{background:#F4F4F4}
.menu.me{left:auto;right:0;min-width:300px;padding:8px}
.meh{display:flex;gap:12px;align-items:center;padding:8px 10px 12px;border-bottom:1px solid var(--line)}
.menu.me{color:var(--ink)}.meh b{display:block;font-weight:600;color:var(--ink)}.meh span{font-size:12.5px;color:var(--mute)}
.mel{font-size:11.5px;color:var(--mute);padding:10px 10px 4px;text-transform:uppercase;letter-spacing:.4px}
.mea{display:flex;gap:8px;align-items:center;font-size:13px;padding:4px 10px;color:#333}
.menu.me .mi{color:var(--ink);margin-top:6px;border-top:1px solid var(--line);border-radius:0;padding-top:12px}
.menu .mi small{color:var(--mute);margin-left:auto}
.search{flex:0 1 420px;margin:0 auto;display:flex;align-items:center;gap:8px;height:34px;background:#F2F2F2;border-radius:8px;padding:0 12px;color:var(--mute)}
.search input{border:0;background:none;outline:0;font:inherit;width:100%;color:var(--ink)}
.avatar{width:32px;height:32px;border-radius:50%;background:#2B2B2B;color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center}
.content{flex:1;overflow:auto;padding:28px 32px 48px}
.ph{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;gap:16px}
.ph h1{margin:0;font-size:24px;font-weight:600;letter-spacing:-.2px}
.ph .subt{color:var(--mute);margin-top:4px;font-size:14px}
.acts{display:flex;align-items:center;gap:12px}
/* buttons */
.btn{height:38px;padding:0 16px;border-radius:8px;border:1px solid transparent;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn.p{background:var(--blue);color:#fff}.btn.p:hover{background:var(--blue-d)}
.btn.s{background:#fff;border-color:#D6D6D6;color:var(--ink)}.btn.s:hover{background:#F7F7F7}
.btn.g{background:none;color:var(--blue);padding:0 8px}.btn.g:hover{background:var(--blue-t)}
.btn[disabled],.btn[disabled]:hover,.btn.locked,.btn.locked:hover{background:#ECECEC;color:#A4A4A4;border-color:#ECECEC;cursor:not-allowed}
.btn.locked{cursor:pointer;position:relative}
.btn.locked:hover::after{content:attr(data-tip);position:absolute;top:calc(100% + 8px);right:0;background:#1F1F1F;color:#fff;font-size:12px;font-weight:500;padding:7px 10px;border-radius:6px;white-space:nowrap;z-index:5}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(44,81,169,.45)}100%{box-shadow:0 0 0 10px rgba(44,81,169,0)}}
.ln-card.pulse{animation:pulse .9s ease-out 2;border-color:var(--blue)}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.pill:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.pill.needs{background:var(--warn-t);color:var(--warn)}
.pill.ready{background:var(--blue-t);color:var(--blue)}
.pill.ok{background:var(--ok-t);color:var(--ok)}
.pill.err{background:var(--err-t);color:var(--err)}
/* IQ */
.iq{border:1px solid var(--ai-b);background:linear-gradient(90deg,#FFF4EE,#F6F7FF 60%);border-radius:var(--r);padding:14px 16px 14px 18px;display:flex;gap:14px;align-items:flex-start;margin-bottom:20px}
.orb{width:24px;height:24px;flex:none;background:var(--orbimg) center/contain no-repeat}
.orb.sm{width:20px;height:20px}
.iqtag{color:var(--iq);font-weight:600;font-size:12px;margin-right:8px}
.iq .t{font-size:15px;font-weight:600}
.iq .d{color:#555;margin-top:3px}
.iq .wk{margin-top:8px;color:#333}
.iq .wk b{color:var(--iq);font-weight:600}
.iq .r{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.iq .r .row{display:flex;gap:10px;align-items:center}
/* IQ v2 */
.iq2{border:1px solid var(--ai-b);background:linear-gradient(90deg,#FFF4EE,#F3F8FF 70%);border-radius:var(--r);margin-bottom:20px;overflow:hidden}
.iq2 .im{display:flex;gap:14px;align-items:center;padding:16px 18px}
.iq2 .eb{font-size:12px;font-weight:600;color:var(--iq);letter-spacing:.2px;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.orb.lk{width:16px;height:16px}
.iq2 .im{padding-left:20px!important}
.iq2 .t{font-size:16px;font-weight:600}
.iqchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.iqchip{border:1px solid var(--ai-b);background:#fff;border-radius:999px;height:28px;padding:0 12px;font-size:13px;color:#444;display:inline-flex;align-items:center;gap:6px}
.iqchip b{font-weight:600;color:var(--ink)}
.iqchip:hover{border-color:#F2B49B;background:#FDFCFF}
.iqchip .ic{color:var(--warn-tx)}
.iq2 .note{display:flex;align-items:center;gap:10px;padding:10px 18px;border-top:1px solid var(--ai-b);background:rgba(255,255,255,.55);font-size:13.5px;color:#333}
.iq2 .note .lab{font-weight:600;color:#333;white-space:nowrap}
.iq2 .note a{margin-left:auto;white-space:nowrap;font-size:13px}
.askbtn{white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px 0 8px;border-radius:999px;border:1px solid transparent;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(90deg,#FF7A50,#FBBF5A,#B48CF5,#53B4FF) border-box;color:var(--ai);font-weight:600;font-size:13.5px}
.askbtn:hover{background:linear-gradient(#FFF5EF,#FFF5EF) padding-box,linear-gradient(90deg,#FF7A50,#FBBF5A,#B48CF5,#53B4FF) border-box}
.srclink{display:inline-flex;align-items:center;gap:6px}
.srclink .ic{width:14px;height:14px;color:var(--blue)}
.pager{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--line);font-size:13px;color:var(--mute)}
.drop{border:1.5px dashed #C9C9C9;border-radius:12px;background:#FAFAFA;padding:34px 20px;text-align:center;transition:.15s}
.drop.over{border-color:var(--blue);background:var(--blue-t)}
.drop .cic{width:52px;height:52px;border-radius:50%;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;color:var(--blue)}
.drop h3{margin:0 0 6px;font-size:17px;font-weight:600}
.drop p{margin:0 0 16px;color:#555}
.drop small{display:block;color:var(--mute);margin-top:14px;font-size:12px}
.drop.mini{padding:12px 16px;display:flex;align-items:center;gap:12px;text-align:left}
.drop.big{padding:28px 24px 22px;background:linear-gradient(180deg,#F8FAFF,#F3F6FD);border-color:#B9C7EA}
.papers{position:relative;width:120px;height:86px;margin:0 auto 16px}
.pp{position:absolute;width:64px;height:80px;background:#fff;border-radius:6px;box-shadow:0 2px 6px rgba(30,50,100,.12);padding:10px 8px;display:flex;flex-direction:column;gap:5px}
.pp i{display:block;height:4px;border-radius:2px;background:#E4E8F2}
.pp i.s{width:60%}.pp i.hl{background:#FFD9C8;outline:1.5px solid #F06A3C;outline-offset:1px}
.pp.a{left:6px;top:8px;transform:rotate(-10deg)}.pp.b{left:50px;top:8px;transform:rotate(9deg)}.pp.c{left:28px;top:2px;z-index:2}
.pp .up{position:absolute;right:-10px;bottom:-8px;width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px #F5F7FD}
.fmt{display:flex;gap:6px;justify-content:center;align-items:center;margin-top:16px;font-size:12px;color:var(--mute)}
.fmt span{border:1px solid #D5DCEC;background:#fff;border-radius:4px;padding:1px 6px;font-size:10.5px;font-weight:600;color:#55607A;letter-spacing:.3px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.step{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:#444;line-height:1.35}
.step b{flex:none;width:20px;height:20px;border-radius:50%;background:#F1F1F1;color:#555;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:600}
.ways2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.w2{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:36px 1fr;column-gap:12px;align-items:center;min-width:0}
.w2 .ti{width:36px;height:36px;border-radius:8px;background:#F4F4F4;display:flex;align-items:center;justify-content:center;color:#444;grid-row:span 2}
.w2 b{font-weight:600;font-size:13.5px}
.w2 .ac{font-size:12.5px;display:flex;align-items:center;gap:6px;min-width:0;margin-top:2px}
.w2 .ac code{font-family:inherit;color:#555;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.w2 .ac a{white-space:nowrap;font-size:12.5px}
.ohd{font-size:12px;font-weight:600;color:var(--mute);letter-spacing:.3px;margin-top:20px;text-transform:uppercase}
.alt{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.alt div{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;gap:10px;font-size:13px;color:#444}
.alt b{display:block;color:var(--ink);font-weight:600;font-size:13.5px;margin-bottom:2px}
/* segmented filter */
.tbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}.tbar .tsearch{flex:1 1 220px;max-width:320px}
.tbar .sp{flex:1}
.seg{display:inline-flex;background:none;padding:0;gap:4px}
.sg{white-space:nowrap;border:0;background:none;height:34px;padding:0 12px;border-radius:8px;display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:500;color:#555}
.sg:hover{color:var(--ink);background:#F5F5F5}
.sg.on{background:#EFEFEF;color:var(--ink);font-weight:600}.sg.on b{background:var(--ink);color:#fff}
.sg b{font-size:11.5px;font-weight:600;min-width:20px;height:20px;padding:0 6px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;background:#EDEDED;color:#555}

.sd{width:7px;height:7px;border-radius:50%;display:none}
.wya .wrow{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.wya .wrow .wy{margin:0;flex-direction:column;gap:10px}
/* accounting v2 */
.stats4{display:grid;grid-template-columns:repeat(4,1fr);margin-bottom:20px}
.st2{display:flex;gap:12px;padding:16px 18px;border-right:1px solid var(--line)}
.st2:last-child{border-right:0}
.sti{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.st2 .sti{background:#F3F4F6;color:#555}.st2.bad .sti{background:var(--err-t);color:var(--err)}
.st2 .k{font-size:12.5px;color:#555}.st2 .v{font-size:21px;font-weight:600;margin:2px 0}.st2 .s{font-size:12.5px;color:var(--mute)}
.st2.bad .v{color:var(--err)}
.att2{display:grid;grid-template-columns:36px 1fr auto;gap:14px;align-items:start;padding:16px;border-top:1px solid var(--line2)}
.ati{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.ati{background:#F3F4F6!important}.ati.bad{color:var(--err)}.ati.warn{color:#9A6400}
.atb{min-width:0}.att2 .att{display:flex;align-items:baseline;gap:10px;padding:0;border:0}

.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-bottom:20px}
.stat{padding:16px 20px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat .k{color:#444;font-size:13px}.stat .v{font-size:22px;font-weight:600;margin:4px 0 2px}.stat .s{color:var(--mute);font-size:13px}
.stat.bad .v,.stat.bad .s{color:var(--err)}
.att{display:flex;gap:14px;padding:16px;border-top:1px solid var(--line)}
.att .t{font-weight:600}
.att .m{color:var(--mute);font-size:12.5px;margin:3px 0 6px}
.att .sg{display:inline-flex;align-items:center;gap:8px;background:#FFF1EC;color:#8A2E0E;border-radius:6px;padding:6px 10px;margin-top:8px;font-size:13px}
.healthy{background:#E8F4EC;border-radius:12px;padding:18px 20px;display:flex;align-items:center;gap:16px;margin-bottom:20px}
.healthy .ci{width:44px;height:44px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--ok)}
.healthy b{color:var(--ok);font-size:16px}
.healthy span{display:block;color:#2B6B40;font-size:13px;margin-top:3px}
.optc{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px;cursor:pointer}
.optc.on{border:2px solid var(--blue);background:#F8FAFF;padding:13px 15px}
.optc .tt{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
.optc.on .radio{border:5px solid var(--blue)}
.will{background:#F5F5F5;border-radius:10px;padding:14px 16px}
.will div{display:flex;gap:8px;align-items:center;font-size:13.5px;margin-top:8px;color:#333}
.will .ic{color:var(--ok)}
/* empty */
.empty{max-width:720px;margin:4px auto 0;background:#fff;border:1px solid var(--line);border-radius:16px;padding:40px}
.empty .mi{width:48px;height:48px;border-radius:10px;background:var(--orange-t);color:var(--orange-tx);display:flex;align-items:center;justify-content:center}
.empty h2{font-size:26px;margin:24px 0 14px;font-weight:600}
.empty p{color:#444;font-size:16px;line-height:1.5;margin:0 0 22px}
.copyrow{display:flex;gap:12px;align-items:center}
.copyrow .inp{background:#F3F3F3;border-color:#E3E3E3}
.ways{border:1px solid var(--line);border-radius:10px;margin-top:8px}
.way{display:flex;align-items:center;gap:16px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.way:last-child{border-bottom:0}.way:hover{background:#FAFAFA}
.way b{display:block;font-weight:600;font-size:15px}.way span{color:#555;font-size:13px}
.or{display:flex;align-items:center;gap:12px;color:var(--mute);font-size:13px;margin:22px 0 14px}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.mig{max-width:720px;margin:20px auto;background:var(--blue-t);border-radius:10px;padding:12px 20px;display:flex;gap:10px;align-items:center;color:#333}
/* placeholder */
.placeholder{max-width:560px;margin:80px auto;text-align:center;color:#555}
.placeholder h2{color:var(--ink)}
/* proto panel */
.proto{position:fixed;left:16px;bottom:16px;z-index:90}
.protob{min-width:36px;justify-content:center;background:#1F1F1F;color:#fff;border:0;border-radius:999px;height:36px;padding:0 14px;font-weight:600;font-size:12.5px;display:flex;gap:8px;align-items:center;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.protom{position:absolute;bottom:44px;left:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 36px rgba(0,0,0,.2);width:290px;padding:8px}
.protom h5{margin:8px 10px 4px;font-size:11px;letter-spacing:.5px;color:var(--mute);text-transform:uppercase}
.protom .mi{padding:8px 10px;border-radius:7px;cursor:pointer;font-size:13.5px;display:flex;gap:8px;align-items:center}
.protom .mi:hover{background:#F4F4F4}
.protom .mi .k{color:var(--mute);font-size:12px;width:26px}
.spin{animation:rot 1s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
.ask{position:fixed;right:24px;top:72px;width:380px;background:#fff;border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.2);z-index:70;border:1px solid var(--ai-b);overflow:hidden}
.ask .ah{display:flex;align-items:center;gap:10px;padding:14px 16px;background:linear-gradient(90deg,#FFF4EE,#F6F7FF);border-bottom:1px solid var(--ai-b)}
.ask .ab{padding:14px 16px;max-height:420px;overflow:auto}
.bub{background:#F4F4F4;border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:13.5px;line-height:1.45}
.bub.me{background:#F3F2F7;color:var(--ink);margin-left:56px;border-radius:14px 14px 4px 14px;padding:9px 13px}
.qs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.qsl{font-size:11.5px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.4px;margin:6px 0 8px}
.qs{display:flex;flex-direction:column;align-items:flex-start;gap:6px}.qs button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ai-b);background:#fff;border-radius:999px;padding:5px 10px;font-size:12.5px;color:var(--ai)}
.ask .af{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.tw3{grid-column:2/-1;display:flex;gap:8px;flex-wrap:wrap}.tw3 span{flex:1;min-width:104px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;display:flex;flex-direction:column;gap:1px}.tw3 small{font-size:11.5px;color:var(--mute)}.tw3 b{font-size:15px;font-weight:600}.tw3 em{font-style:normal;font-size:12px;color:var(--mute)}.tw3 .bad{border-color:#F3B9B5;background:var(--err-t)}.tw3 .bad b{color:var(--err)}
.iqg,.iq2 .eb,.wh{background:linear-gradient(90deg,#FF3D1F,#F08A1E 30%,#9A6BF2 65%,#1E9BFF);-webkit-background-clip:text;background-clip:text;color:transparent}.iq2{border:1px solid transparent!important;background:linear-gradient(90deg,#FFF4EE,#F8F6FF 55%,#F1F8FF) padding-box,linear-gradient(90deg,#FFB494,#F7D08E,#D2B8F7,#9FD3FF) border-box!important}
.ic [stroke="currentColor"]{vector-effect:non-scaling-stroke;stroke-width:1.6}.ic.s12 [stroke="currentColor"],.ic.s14 [stroke="currentColor"]{stroke-width:1.35}.ic.s16 [stroke="currentColor"]{stroke-width:1.45}.ic.s24 [stroke="currentColor"]{stroke-width:1.75}.ic2.qtyc{grid-template-columns:32px minmax(0,1fr)}.ic2.qtyc .tl{align-self:start}.ic2.qtyc .tw3{grid-column:2/-1;order:3}.ic2.qtyc .ia{grid-column:2/-1;order:4;justify-content:flex-start;flex-wrap:wrap}.tw3{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))}.tw3 span{min-width:0!important}table.mt td .supn,table.mt td .supm,.cf div span{white-space:normal!important;display:-webkit-box!important;-webkit-line-clamp:2;-webkit-box-orient:vertical}th{white-space:nowrap}@media (max-width:760px){.ph h1{flex-wrap:wrap}}@media (max-width:1280px) and (min-width:761px){.dock{position:fixed;top:0;right:0;bottom:0;z-index:85;box-shadow:-16px 0 40px rgba(0,0,0,.12)}}

function whyHTML(r){const ev=r.ev||[['ok',`Same supplier code on ${r.c>=98?'12':'4'} past orders`],['ok',`Pack ${r.conv}, your count unit`],['ok','Price within 5% of last order']];
  const cands=r.cands||[[r.to,r.c]];const pick=S.maps.pick&&S.maps.pick[r.id]!=null?S.maps.pick[r.id]:(r.to?0:-1);
  const cur=pick>=0?cands[pick]:null;const c=CONF(cur?cur[1]:r.c);
  const okE=ev.filter(e=>e[0]==='ok'),wE=ev.filter(e=>e[0]!=='ok');
  return `<div class="why2"><div class="wh">${I('sparkle:f','s14 sp')}<span>Toast IQ suggestion</span><button class="iconbtn" aria-label="Close panel" style="margin-left:auto;padding:2px">${I('x','s16')}</button></div>

   <div class="mva">${I('arrow-down','s16')}${cur?`<span class="cfp ${c.k}">${c.t}</span>`:''}</div>
   <div class="mv dst ${cur?'':'empty'}"><small>Your item</small><b>${cur?cur[0].replace(' ?',''):'Not picked yet'}</b><span>${cur?(pick===0&&r.unit?r.unit:r.conv):'Choose one below or create a new item'}</span></div></div>
  <div class="evb"><div class="evbh"><span>Evidence</span><small>${okE.length} of ${ev.length} checks pass</small></div>${ev.map(e=>`<div class="evr ${e[0]==='ok'?'':'w'}">${I(e[0]==='ok'?'check-circle':'warning-circle','s16')}<span>${e[1]}</span></div>`).join('')}</div>
  ${(()=>{const others=cands.filter((cd,j)=>j!==pick);return `<div class="evh">${!r.to?'Pick a match':others.length?'Not right? Other matches':'Not right?'}</div>`})()}
  ${cands.map((cd,j)=>j===pick?'':`<div class="cand2" onclick="S.maps.pick=S.maps.pick||{};S.maps.pick['${r.id}']=${j};save();render()"><span>${cd[0]}</span><small>${CONF(cd[1]).t}</small></div>`).join('')}
  <div class="alts"><button class="altb" onclick="toast('Search your catalog','Pick any of your 412 items.')">${I('magnifying-glass','s14')}Search items</button><button class="altb" onclick="toast('Create new item','Opens the New item panel.')">${I('plus','s14')}Create new item</button></div>
  <div style="flex:1"></div><div class="wf2"><button class="btn s" onclick="skipMap('${r.id}')">Skip</button><button class="btn p" ${pick<0?'disabled':''} onclick="acceptMap('${r.id}')">${I('check','s14')}Accept match</button></div></div>`}
function acceptMap(id){const r=S.maps.rows.find(x=>x.id===id);const p=S.maps.pick&&S.maps.pick[id];const name=r.cands&&p!=null?r.cands[p][0]:r.to;if(!name){S.maps.sel=id;save();render();return}
  S.maps.done[id]=1;save();render();toast('Mapping saved',`${r.code.split(' · ')[1]} → ${name}. Used on every future invoice · change it anytime under Mapped.`,()=>{delete S.maps.done[id];save();render()})}
function unmap(id){const r=S.maps.rows.find(x=>x.id===id);delete S.maps.done[id];if(!S.maps.rows.some(x=>x.c>=90&&S.maps.done[x.id]))S.maps.accepted=false;save();render();toast('Mapping undone',`${r.code.split(' · ')[1]} is back in Suggested. Invoices already approved keep their lines.`)}
function unmapBulk(){S.maps.rows.filter(r=>r.c>=90).forEach(r=>delete S.maps.done[r.id]);S.maps.accepted=false;save();render();toast('Bulk accept undone','Those matches are back in Suggested. Invoices already approved keep their lines.')}
function skipMap(id){const rows=S.maps.rows.filter(r=>!S.maps.done[r.id]);const i=rows.findIndex(r=>r.id===id);const n=rows[(i+1)%rows.length];S.maps.sel=n.id;save();render()}
function acceptHigh(){S.maps.rows.filter(r=>r.c>=90).forEach(r=>S.maps.done[r.id]=1);S.maps.accepted=true;save();render();toast('31 mappings accepted','15 suggestions left. Undo anytime under Mapped.',()=>{S.maps.rows.filter(r=>r.c>=90).forEach(r=>delete S.maps.done[r.id]);S.maps.accepted=false;save();render()})}

  if(/\b(weather|news|joke|poem|song|movie|sports?|stock market|bitcoin|recipe for|write (me )?an? (email|essay)|who is|capital of)\b/.test(t))return {t:'That’s outside what I can help with here. I only know Harbor & Vine’s invoices, suppliers, item costs and accounting sync. Here’s what I can do:',chips:Object.keys(QA)};
  if(t.split(/\s+/).length<=2){
    if(/price|cost|expens|margin/.test(t))return {t:'Happy to dig in. Which do you mean?',chips:['Why is food cost up this week?','Which suppliers raised prices?']};
    if(/sysco/.test(t))return {t:'Sysco has one invoice this week ($2,418.67). What do you want to know?',chips:['What’s waiting on the Sysco invoice?','Which suppliers raised prices?']};
    if(/sync|quickbooks|books|gl/.test(t))return {t:'Do you want to know what’s blocking tonight’s sync?',chips:['What’s left before tonight’s sync?']};
    if(/avocado|chicken|wine/.test(t))return {t:'Got it. Are you asking about its price or about the invoice it’s on?',chips:['Which suppliers raised prices?','What’s waiting on the Sysco invoice?']};
    return {t:'Could you tell me a bit more? For example, a supplier, an item, or what you’re trying to finish.',chips:Object.keys(QA)}}
  return {t:'I’m not sure I understood that one. Did you mean one of these?',chips:Object.keys(QA)}}
function msgHTML(m){if(m.r==='me')return `<div class="bub me">${m.t}</div>`;
  if(m.r==='typing')return `<div class="msg"><span class="dots3"><i></i><i></i><i></i></span></div>`;
  if(m.todo)return `<div class="steps2"><div>${I('check','s14')}Checked 14 invoices this week</div><div>${I('check','s14')}Checked accounting sync</div></div><div class="msg nb">Five things stand between you and a clean sync tonight. Three are quick invoice checks (about 2 min); two are in accounting.</div>${todoCard()}`;
  const words=m.t.split(' ');const shown=m.n==null?m.t:words.slice(0,m.n).join(' ');const done=m.n==null||m.n>=words.length;
  return `<div class="msg"><div>${shown}${done?'':'<span class="caret"></span>'}${done&&m.chips?`<div class="qs" style="margin-top:10px">${m.chips.map(CHIP).join('')}</div>`:''}${done&&m.acts?`<div class="acts2">${m.acts.map(a=>`<button class="btn s sm" onclick="${a[1]}">${a[0]}${I('arrow-right','s14')}</button>`).join('')}</div>`:''}${done?`<div class="fb"><button aria-label="Helpful" title="Helpful" onclick="toast('Thanks for the feedback')">${I('thumbs-up','s14')}</button><button aria-label="Not helpful" title="Not helpful" onclick="toast('Thanks — we’ll use this to improve Toast IQ')">${I('thumbs-down','s14')}</button><button aria-label="Copy answer" title="Copy" onclick="try{navigator.clipboard.writeText(this.closest('.msg').innerText).catch(()=>{})}catch(e){};toast('Copied')">${I('copy','s14')}</button></div>`:''}</div></div>`}
function askBody(){const L=UI.askLog;let h='';
  if(!L.length)h+=`<div class="hello"><div class="orb" style="width:44px;height:44px;margin-bottom:12px"></div><b>Hi Maya, how can I help?</b><span>Ask about invoices, supplier prices, item costs or tonight’s sync.</span></div><div class="qsl">Try asking</div><div class="qs">${Object.keys(QA).map(CHIP).join('')}</div>`;
  return h+L.map(msgHTML).join('')}
function askHTML(){return `<aside class="dock" aria-label="Toast IQ assistant"><div class="dh2"><span class="orb" style="width:22px;height:22px"></span><b>Toast IQ</b>${UI.askLog.length?`<button class="btn g sm nc" onclick="UI.askLog=[];render()">${I('plus','s14')}New chat</button>`:''}<button class="iconbtn" aria-label="Close Toast IQ" title="Close" onclick="openAsk()">${I('x','s16')}</button></div>
 <div class="ctx">${I('storefront','s14')}Answering for <b>${S.loc}</b> · week of Nov 10</div>
 <div class="ab" aria-live="polite">${askBody()}</div>
 <div class="af2"><input aria-label="Ask Toast IQ" placeholder="Ask about invoices, prices or sync" onkeydown="if(event.key==='Enter'&&this.value.trim()){askQ(this.value);this.value=''}"><button class="snd" aria-label="Send" onclick="const i=this.previousElementSibling;if(i.value.trim()){askQ(i.value);i.value=''}">${I('arrow-up','s16')}</button></div>
 <div class="disc">Toast IQ can make mistakes. Please double-check its responses.</div></aside>`}
function paintAsk(){const b=$('.dock .ab');if(!b)return;b.innerHTML=askBody();b.scrollTop=b.scrollHeight;a11yPass()}
function askQ(q){if(UI.askBusy)return;UI.askBusy=true;const L=UI.askLog;const first=!L.length;L.push({r:'me',t:esc(q)});L.push({r:'typing'});if(first||!$('.dock'))render();paintAsk();
  setTimeout(()=>{L.pop();const r=reply(q);if(r.todo){L.push({r:'ai',todo:1});UI.askBusy=false;paintAsk();return}
    const m={r:'ai',t:r.t,chips:r.chips,acts:r.acts,n:0};L.push(m);const total=r.t.split(' ').length;
    const iv=setInterval(()=>{m.n+=2;paintAsk();if(m.n>=total){clearInterval(iv);m.n=null;UI.askBusy=false;paintAsk()}},45)},750)}

/* ---------------- placeholder ---------------- */
const AREAS={home:['house','Home','Today’s sales, labor and alerts for each location.'],reports:['chart-bar','Reports','Sales, food cost and variance over time.'],menus:['fork-knife','Menus','Menu items, modifiers and recipe costing.'],suppliers:['truck','Suppliers','Every vendor with contacts, terms, delivery days and price history.'],counts:['clipboard-text','Counts','Weekly stock counts by storage area, with variance against what was received.'],pos:['file-text','Purchase orders','Orders sent to suppliers, matched against what arrives on the invoice.'],gl:['sliders-horizontal','GL mappings','Which QuickBooks account each inventory category posts to.'],employees:['users','Employees','Staff, roles and permissions.'],settings:['gear','Settings','Locations, integrations and preferences.']};
function illo(ic){return `<div class="illo"><div class="ib"></div><div class="ip"><i class="t"></i><i></i><i class="s"></i><i></i><span class="ia2">${I(ic,'s20')}</span></div></div>`}
function emptyHTML(ic,title,desc,cta,learn,tag){return `<div class="es">${tag?`<span class="tagp">${tag}</span>`:''}${illo(ic)}<h3>${title}</h3><p>${desc}</p>${cta||''}</div>${learn?`<div class="esl"><a>${learn}</a></div>`:''}`}
const EMPTY={suppliers:['Your suppliers will show here','Every vendor you buy from, with contacts, terms, delivery days and price history.','Add supplier','Learn more about suppliers'],counts:['Your counts will show here','Count stock by storage area each week and see variance against what was received.','Start a count','Learn more about counts'],pos:['Your purchase orders will show here','Send orders to suppliers and match them against what arrives on the invoice.','Create purchase order','Learn more about purchase orders'],gl:['Your GL mappings will show here','Choose which QuickBooks account each inventory category posts to.','Map categories','Learn more about GL mappings'],home:['Your day at a glance will show here','Sales, labor and alerts for each location.','',''],reports:['Your reports will show here','Sales, food cost and variance over time.','',''],menus:['Your menus will show here','Menu items, modifiers and recipe costing.','',''],employees:['Your team will show here','Staff, roles and permissions.','',''],settings:['Settings','Locations, integrations and preferences.','','']};
function pagePlaceholder(k){const a=AREAS[k]||['info',k,''];const e=EMPTY[k]||[a[1],a[2],'',''];
  return `<div class="ph"><div><h1>${a[1]}</h1></div></div><div class="card" style="padding:56px 24px">${emptyHTML(a[0],e[0],e[1],e[2]?`<button class="btn p" onclick="toast('Outside this prototype','This case study goes deep on invoices → review → mappings → books.')">${e[2]}</button>`:'',e[3],'Outside this prototype')}</div>`}
/* ---------------- prototype panel ---------------- */
function protoHTML(){return `<div class="proto">${UI.proto?`<div class="protom" onclick="event.stopPropagation()"><div class="pmh"><b>About this concept</b><span>An unofficial concept for Toast’s invoice-to-books flow. Reading, matching and QuickBooks responses are simulated. Designed and built by <a href="https://www.linkedin.com/in/vithyanela" target="_blank" rel="noopener">Vithyanela</a>. Data is fictional.</span></div>
 <h5>Try it as</h5>${Object.entries(ROLES).map(([k,v])=>`<div class="mi" onclick="S.role='${k}';UI.proto=false;save();render();toast('Viewing as ${v.name}','${v.title}')"><span class="k">${(S.role||'gm')===k?I('check','s14'):''}</span>${v.name.split(' ')[0]} · ${v.title}</div>`).join('')}
 <a class="mi" href="index.html" style="margin-top:4px;border-top:1px solid var(--line);border-radius:0;padding-top:10px;color:var(--ink);font-weight:500;text-decoration:none"><span class="k">${I('arrow-left','s14')}</span>Back to the case study</a><div class="mi" onclick="resetAll()"><span class="k">${I('arrows-clockwise','s14')}</span>Start over</div></div>`:''}
 <button class="cnote" aria-expanded="${!!UI.proto}" onclick="event.stopPropagation();UI.proto=!UI.proto;render()">${I('info','s14')}${S.nav.rail?'':'<span>Concept by Vithyanela · not affiliated with Toast</span>'}</button><a class="cslink" href="index.html" title="Read the case study" aria-label="Read the case study">${I('book-open','s14')}${S.nav.rail?'':'<span>Read the case study</span>'}</a></div>`}
function resetAll(){S=seed();try{localStorage.removeItem('toastproto:v5')}catch(e){};UI.modal=null;UI.drawer=null;go('#invoices');render();toast('Prototype reset','Back to Monday morning, week of Nov 10.')}

/* ---------------- render ---------------- */
function a11yPass(){const lm=(q,r,l)=>{const e=document.querySelector(q);if(e){e.setAttribute('role',r);if(l)e.setAttribute('aria-label',l)}};lm('.side','navigation','Back office');lm('.top','banner');lm('.content','main');lm('.proto','complementary','About this concept');document.querySelectorAll('.rbi[aria-label]:not([role])').forEach(e=>e.setAttribute('role','button'));document.querySelectorAll('.cnote').forEach(e=>{if(!e.textContent.trim())e.setAttribute('aria-label','About this concept')});document.querySelectorAll('th').forEach(th=>{if(!th.textContent.trim()&&!th.querySelector('.sr'))th.innerHTML='<span class="sr">Actions</span>'});document.querySelectorAll('a[onclick]:not([href])').forEach(a=>{a.setAttribute('role','link');a.tabIndex=0});document.querySelectorAll('[onclick]').forEach(el=>{const t=el.tagName;if(t==='BUTTON'||t==='A'||t==='INPUT'||t==='LABEL'||el.classList.contains('scrim')||el.classList.contains('dscrim')||el.classList.contains('dmenu')||el.classList.contains('menu'))return;if(t==='A'){return}if(!el.hasAttribute('role'))el.setAttribute('role',t==='TR'?'link':'button');if(!el.hasAttribute('tabindex'))el.tabIndex=0});
  document.querySelectorAll('a[onclick]:not([href])').forEach(a=>{a.setAttribute('role','button');a.tabIndex=0});
  const d=document.querySelector('.modal,.drawer');if(d&&!d.contains(document.activeElement)){const f=d.querySelector('button,input,select,[tabindex="0"]');(f||d).focus()}}
document.addEventListener('keydown',e=>{const t=e.target;if((e.key==='Enter'||e.key===' ')&&t&&t.matches&&t.matches('[role=button],[role=link]')&&!/^(BUTTON|INPUT|TEXTAREA|SELECT)$/.test(t.tagName)&&!(t.tagName==='A'&&t.hasAttribute('href'))){e.preventDefault();t.click();return}if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button],[role=link]')&&e.target.tagName!=='BUTTON'){e.preventDefault();e.target.click()}});
function autoRail(){const n=innerWidth<1180;if(n&&!UI.autoRail){UI.autoRail=true;UI.railUser=S.nav.rail;S.nav.rail=true}else if(!n&&UI.autoRail){UI.autoRail=false;S.nav.rail=!!UI.railUser}}
let rT;addEventListener('resize',()=>{clearTimeout(rT);rT=setTimeout(render,120)});
function render(){
  autoRail();const [p,a]=route();let page;
  if(p==='invoices')page=pageInvoices();else if(p==='review')page=pageReview(a);else if(p==='mappings')page=pageMappings();else if(p==='accounting')page=pageAccounting();else page=pagePlaceholder(p);
  const keep=$('.content')?$('.content').scrollTop:0;
  $('#root').innerHTML=`<div class="app">${sideHTML()}<div class="main">${topHTML()}<div class="content">${page}</div></div>${UI.ask?askHTML():''}</div>
  ${UI.modal==='upload'?uploadHTML():UI.modal==='bulk'?bulkHTML():UI.modal==='remap'?remapHTML():UI.modal==='sources'?sourcesHTML():''}${drawerHTML()}${protoHTML()}`;
  $('.content').scrollTop=keep;a11yPass();
}
document.addEventListener('click',e=>{let r=false;if(UI.proto&&!e.target.closest('.proto')){UI.proto=false;r=true}if(UI.fopen&&!e.target.closest('.fc')){UI.fopen=null;r=true}if(UI.me){UI.me=false;r=true}if(UI.locOpen&&!e.target.closest('.loc')){UI.locOpen=false;r=true}if(UI.pop&&!e.target.closest('.dmenu')){UI.pop=null;r=true}if(r)render()});
document.addEventListener('keydown',e=>{const t=e.target;if((e.key==='Enter'||e.key===' ')&&t&&t.matches&&t.matches('[role=button],[role=link]')&&!/^(BUTTON|INPUT|TEXTAREA|SELECT)$/.test(t.tagName)&&!(t.tagName==='A'&&t.hasAttribute('href'))){e.preventDefault();t.click();return}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='b'){e.preventDefault();toggleRail();return}if(e.key==='Escape'){UI.modal=null;UI.drawer=null;UI.ask=false;UI.pop=null;render()}});
render();
